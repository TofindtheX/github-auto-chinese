name: Auto Translate README to Chinese

on:
  push:
    branches:
      - main
    paths:
      - "README.md"

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest

    if: "!contains(github.event.head_commit.message, '[auto-translate]')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Argos Translate
        run: |
          pip install --upgrade pip
          pip install argostranslate

      - name: Install English to Chinese model
        run: |
          python << 'PYTHON'
          import argostranslate.package

          argostranslate.package.update_package_index()

          packages = argostranslate.package.get_available_packages()

          package = next(
              p for p in packages
              if p.from_code == "en" and p.to_code == "zh"
          )

          argostranslate.package.install_from_path(
              package.download()
          )
          PYTHON

      - name: Translate README
        run: |
          python << 'PYTHON'
          from pathlib import Path
          import re
          import argostranslate.translate

          content = Path("README.md").read_text(
              encoding="utf-8"
          )

          # 保护 Markdown 代码块
          parts = re.split(
              r"(```.*?```)",
              content,
              flags=re.DOTALL
          )

          translated_parts = []

          for part in parts:
              if part.startswith("```"):
                  translated_parts.append(part)
              elif part.strip():
                  translated_parts.append(
                      argostranslate.translate.translate(
                          part,
                          "en",
                          "zh"
                      )
                  )
              else:
                  translated_parts.append(part)

          translated = "".join(translated_parts)

          Path("README.zh-CN.md").write_text(
              translated,
              encoding="utf-8"
          )
          PYTHON

      - name: Commit translated README
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.zh-CN.md

          if git diff --cached --quiet; then
            echo "No translation changes."
          else
            git commit -m "[auto-translate] Update Chinese README"
            git push
          fi
